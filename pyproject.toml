[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fl-sim"
dynamic = ["version"]
description = "A Simple Simulation Framework for Federated Learning Based on PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "wenh06", email = "wenh06@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4",
    "bib-lookup",
    "datasets",
    "deprecate-kwargs",
    "einops",
    "h5py",
    "nltk",
    "numpy",
    "packaging",
    "pandas",
    "PeakUtils",
    "Pillow",
    "PyYAML",
    "requests",
    "scikit-learn",
    "scipy",
    "tokenizers>=0.12.1",
    "torch-ecg",
    "torch-optimizer",
    "torch>=1.10.0",
    "torchvision>=0.11.0",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "ipywidgets",
    "matplotlib",
    "nbsphinx",
    "numpydoc",
    "packaging",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "seaborn",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-emoji-favicon",
    "sphinx-intl",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-napoleon",
    "sphinxcontrib-proof",
    "sphinxcontrib-tikz",
    "sphinxcontrib-pseudocode2",
    "termcolor",
    "tqdm",
]
docs = [
    "nbsphinx",
    "numpydoc",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-emoji-favicon",
    "sphinx-intl",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-napoleon",
    "sphinxcontrib-proof",
    "sphinxcontrib-tikz",
    "sphinxcontrib-pseudocode2",
    "tqdm",
]
test = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
viz = [
    "ipython",
    "ipywidgets",
    "matplotlib",
    "packaging",
    "seaborn",
    "termcolor",
]

[project.scripts]
fl-sim = "fl_sim.cli:main"

[project.urls]
Homepage = "https://github.com/wenh06/fl_sim"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "fl_sim/version.py"
template = "# auto-generated by hatch-vcs, do not edit manually\n__version__ = \"{version}\"\n"

[tool.hatch.build.targets.sdist]
include = [
    "/fl_sim",
]

# configuration for pytest and coverage
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--cov=fl_sim --cov-report term-missing --ignore=test/test-algorithms"
testpaths = [
    "test",
]

[tool.coverage.run]
source = [
    "fl_sim",
]
omit = [
    # omit all test files
    "tests/*",
    # omit algorithms, which will be tested separately
    "fl_sim/algorithms/*",
    # omit several data processing files which are not used currently
    "fl_sim/data_processing/_noniid_partition.py",
    "fl_sim/data_processing/leaf_sent140.py",
    "fl_sim/data_processing/cifar.py",
    "fl_sim/data_processing/libsvm_datasets.py",
    # visualization panel requires notebook environment
    "fl_sim/utils/viz.py",
    # fl_sim/utils/torch_compat.py
    # compressors not used currently
    "fl_sim/compressors/*",
]

[tool.coverage.report]
omit = [
    # omit all test files
    "tests/*",
    # omit algorithms, which will be tested separately
    "fl_sim/algorithms/*",
    # omit several data processing files which are not used currently
    "fl_sim/data_processing/_noniid_partition.py",
    "fl_sim/data_processing/leaf_sent140.py",
    "fl_sim/data_processing/cifar.py",
    "fl_sim/data_processing/libsvm_datasets.py",
    # visualization panel requires notebook environment
    "fl_sim/utils/viz.py",
    # fl_sim/utils/torch_compat.py
    # compressors not used currently
    "fl_sim/compressors/*",
]
# show_missing = true
# skip_covered = true
exclude_also =[
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]
