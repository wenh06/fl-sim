algorithm:
  name: FedAvg
  server:
    num_clients: null
    clients_sample_ratio: 0.3
    num_iters: 50  # only for a quick test in GitHub Actions, normally much larger
    lr: 0.01
    log_dir: multiprocess-test
    tag: seed_${{ seed }}
  client:
    lr: 0.03
    num_epochs: 2
    batch_size: null  # null for default batch size
dataset:
  name: FedProxFEMNIST
  datadir: null  # default dir
  transform: none  # none for static transform (only normalization, no augmentation)
model:
  name: cnn_femmist_tiny
seed: 42
