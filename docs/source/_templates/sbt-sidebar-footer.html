<div class="sbt-sidebar-footer" style="padding: 1rem; border-top: 1px solid #eee;">
  <div style="font-weight: 600; margin-bottom: 0.5rem; color: var(--pst-color-text-muted);">
    <i class="fa-solid fa-language"></i> Language / 语言
  </div>
  <ul style="list-style: none; padding: 0; margin: 0;">
    {% for label, lang_code in languages %}
      <li style="margin-bottom: 5px;">
        <a href="{{ pathto("", 1) }}../{{ lang_code }}/{{ pagename }}{{ file_suffix }}"
           style="display: block; padding: 4px 12px; border-radius: 4px; text-decoration: none; font-size: 0.9em;
                  {% if lang_code == current_language %}
                    background-color: var(--pst-color-primary); color: white !important; font-weight: bold;
                  {% else %}
                    color: var(--pst-color-link);
                  {% endif %}">
          {{ label }}
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
