{# Version & language switcher flyout, rendered at the end of <body>. #}
<div class="rst-versions" id="versions-flyout" role="note" aria-label="versions and languages">
  <span class="rst-current-version" data-toggle="rst-versions" title="{{ _('Switch version or language') }}">
    <span>{{ current_version or "latest" }}</span>
    <span class="rst-caret">▾</span>
  </span>
  <div class="rst-other-versions">
    <dl>
      <dt>{{ _('Languages') }}</dt>
      {% for label, code, url in languages %}
        <dd>
          <a href="{% if url %}{{ url }}{% else %}{{ pathto("", 1) }}../{{ code }}/{{ pagename }}{{ file_suffix }}{% endif %}"
             {% if code == current_language %}class="rst-current-item"{% endif %}>{{ label }}</a>
        </dd>
      {% endfor %}
    </dl>
    {% if versions %}
      <dl>
        <dt>{{ _('Versions') }}</dt>
        {% for name, url in versions %}
          <dd>
            <a href="{{ url }}" {% if name == current_version %}class="rst-current-item"{% endif %}>{{ name }}</a>
          </dd>
        {% endfor %}
      </dl>
    {% endif %}
  </div>
</div>
